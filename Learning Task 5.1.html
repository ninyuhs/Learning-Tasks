<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Graphical Art</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #333; }
  .gallery { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  figure { margin: 0; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  figcaption { text-align: center; font-size: 14px; margin-top: 8px; color: #444; }
  svg { display: block; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>SVG Graphical Art (200 x 300)</h1>
<div class="gallery">

//sun
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#87ceeb" style="display:none"/>
      <circle cx="100" cy="150" r="45" fill="#ffd400" stroke="#ff9800" stroke-width="4"/>
      <line x1="100" y1="75" x2="100" y2="40" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
      <line x1="45" y1="97" x2="22" y2="72" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
      <line x1="155" y1="97" x2="178" y2="72" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
      <line x1="30" y1="150" x2="8" y2="150" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
      <line x1="170" y1="150" x2="192" y2="150" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="200" x2="200" y2="200" stroke="#2e7d32" stroke-width="6"/>
      <line x1="20" y1="225" x2="180" y2="225" stroke="#66bb6a" stroke-width="4"/>
      <line x1="45" y1="250" x2="155" y2="250" stroke="#a5d6a7" stroke-width="3"/>
    </svg>
    <figcaption>1. Line and Circle</figcaption>
  </figure>

//traffic light
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect x="90" y="200" width="20" height="90" fill="#555"/>
      <rect x="45" y="15" width="110" height="190" rx="18" ry="18" fill="#263238"/>
      <circle cx="100" cy="49.5" r="26" fill="#e53935"/>
      <circle cx="100" cy="110" r="26" fill="#fdd835" opacity="0.35"/>
      <circle cx="100" cy="170.5" r="26" fill="#43a047" opacity="0.35"/>
      <rect x="30" y="285" width="140" height="10" fill="#777"/>
    </svg>
    <figcaption>2. Circle and Rectangle</figcaption>
  </figure>

//mountains
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <circle cx="140" cy="70" r="35" fill="#f5f5dc" stroke="#cfcfa0" stroke-width="3"/>
      <circle cx="152" cy="62" r="6" fill="#e0e0b8"/>
      <circle cx="130" cy="82" r="8" fill="#e0e0b8"/>
      <polyline points="0,260 40,190 70,225 110,150 150,220 175,185 200,240"
                fill="#6d4c41" stroke="#3e2723" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="0,285 50,255 90,275 140,245 200,280"
                fill="none" stroke="#795548" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="105,150 115,165 125,158 135,175"
                fill="none" stroke="#ffffff" stroke-width="3"/>
    </svg>
    <figcaption>3. Polyline and Circle</figcaption>
  </figure>

//alien
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <polygon points="75,130 125,130 175,290 25,290" fill="#fff59d" opacity="0.7"/>
      <ellipse cx="100" cy="95" rx="40" ry="28" fill="#90caf9" stroke="#1565c0" stroke-width="3"/>
      <ellipse cx="100" cy="120" rx="85" ry="20" fill="#9e9e9e" stroke="#424242" stroke-width="4"/>
      <ellipse cx="55" cy="122" rx="7" ry="4" fill="#ff5252"/>
      <ellipse cx="100" cy="127" rx="7" ry="4" fill="#ffeb3b"/>
      <ellipse cx="145" cy="122" rx="7" ry="4" fill="#69f0ae"/>
      <polygon points="30,30 34,40 45,40 36,47 40,58 30,51 20,58 24,47 15,40 26,40" fill="#ffd54f"/>
      <polygon points="170,205 173,212 181,212 175,217 177,225 170,220 163,225 165,217 159,212 167,212" fill="#ffd54f"/>
    </svg>
    <figcaption>4. Polygon and Ellipse</figcaption>
  </figure>

//tree
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <circle cx="165" cy="40" r="20" fill="#ffca28"/>
      <line x1="165" y1="8" x2="165" y2="14" stroke="#ffa000" stroke-width="3"/>
      <line x1="135" y1="40" x2="141" y2="40" stroke="#ffa000" stroke-width="3"/>
      <line x1="143" y1="18" x2="147" y2="22" stroke="#ffa000" stroke-width="3"/>
      <rect x="85" y="150" width="30" height="120" fill="#6d4c41"/>
      <circle cx="100" cy="110" r="55" fill="#2e7d32"/>
      <circle cx="65" cy="150" r="32" fill="#388e3c"/>
      <circle cx="135" cy="150" r="32" fill="#388e3c"/>
      <circle cx="90" cy="95" r="7" fill="#e53935"/>
      <circle cx="120" cy="120" r="7" fill="#e53935"/>
      <circle cx="75" cy="140" r="7" fill="#e53935"/>
      <line x1="0" y1="270" x2="200" y2="270" stroke="#33691e" stroke-width="8"/>
      <line x1="10" y1="288" x2="190" y2="288" stroke="#689f38" stroke-width="4"/>
    </svg>
    <figcaption>5. Circle, Line and Rectangle</figcaption>
  </figure>

//boat

  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <line x1="0" y1="0" x2="0" y2="0" stroke="none" style="display:none"/>
      <polygon points="100,40 100,180 40,180" fill="#fafafa" stroke="#607d8b" stroke-width="3"/>
      <polygon points="108,70 108,180 160,180" fill="#ef5350" stroke="#b71c1c" stroke-width="3"/>
      <polygon points="30,190 170,190 145,230 55,230" fill="#795548" stroke="#3e2723" stroke-width="3"/>
      <polyline points="100,35 100,190" fill="none" stroke="#3e2723" stroke-width="4"/>
      <polyline points="0,245 25,230 50,245 75,230 100,245 125,230 150,245 175,230 200,245"
                fill="none" stroke="#1976d2" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="0,265 25,250 50,265 75,250 100,265 125,250 150,265 175,250 200,265"
                fill="none" stroke="#42a5f5" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="0,285 25,270 50,285 75,270 100,285 125,270 150,285 175,270 200,285"
                fill="none" stroke="#90caf9" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <figcaption>6. Polyline and Polygon</figcaption>
  </figure>

//castle 
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <circle cx="35" cy="35" r="20" fill="#ffd54f"/>
      <ellipse cx="130" cy="40" rx="38" ry="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
      <ellipse cx="155" cy="52" rx="26" ry="10" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
      <rect x="55" y="150" width="90" height="110" fill="#9e9e9e" stroke="#424242" stroke-width="3"/>
      <rect x="35" y="125" width="35" height="135" fill="#bdbdbd" stroke="#424242" stroke-width="3"/>
      <rect x="130" y="125" width="35" height="135" fill="#bdbdbd" stroke="#424242" stroke-width="3"/>
      <polygon points="30,125 52,80 75,125" fill="#c62828" stroke="#7f0000" stroke-width="3"/>
      <polygon points="125,125 147,80 170,125" fill="#c62828" stroke="#7f0000" stroke-width="3"/>
      <polygon points="85,150 100,115 115,150" fill="#1565c0" stroke="#0d47a1" stroke-width="3"/>
      <rect x="88" y="210" width="24" height="50" rx="12" ry="12" fill="#5d4037"/>
      <circle cx="52" cy="160" r="7" fill="#ffee58" stroke="#424242" stroke-width="2"/>
      <circle cx="148" cy="160" r="7" fill="#ffee58" stroke="#424242" stroke-width="2"/>
      <polyline points="100,260 85,275 115,285 90,300"
                fill="none" stroke="#a1887f" stroke-width="8" stroke-linejoin="round"/>
      <polyline points="0,262 200,262" fill="none" stroke="#388e3c" stroke-width="6"/>
    </svg>
    <figcaption>7. Circle, Rectangle, Polyline, Polygon and Ellipse</figcaption>
  </figure>

</div>
</body>
</html>
