<svg width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <path id="c1" d="M390,40 L510,40 L640,250 L550,740 L350,740 L260,250 Z"/>
    <path id="c2" d="M400.8,103 L499.2,103 L605.8,275.2 L532,677 L368,677 L294.2,275.2 Z"/>
    <path id="c3" d="M411.6,166 L488.4,166 L571.6,300.4 L514,614 L386,614 L328.4,300.4 Z"/>
    <path id="c4" d="M422.4,229 L477.6,229 L537.4,325.6 L496,551 L404,551 L362.6,325.6 Z"/>
    <path id="c5" d="M433.2,292 L466.8,292 L503.2,350.8 L478,488 L422,488 L396.8,350.8 Z"/>
  </defs>


  <path d="M450,6 L450,30 M438,16 L462,16" stroke="#bcaaa4" stroke-width="4" stroke-linecap="round"/>

  <text class="r1"><textPath href="#c1" startOffset="0" textLength="1805" lengthAdjust="spacing">hush now, hush the candles burn so low the last bell has gone still i stood among the black umbrellas holding a rose that would not bloom you left the porch light burning for me you left your coat upon the empty chair </textPath></text>

  <text class="r2"><textPath href="#c2" startOffset="0" textLength="1478" lengthAdjust="spacing">and somewhere in the quiet falling rain a song is playing that has no words the earth is soft and the sky is grey and everything i never got to say settles like dust on the velvet lining </textPath></text>

  <text class="r3"><textPath href="#c3" startOffset="0" textLength="1152" lengthAdjust="spacing">i would trade a thousand mornings for one more late goodnight so lay the white lilies down slow let the violins play slow and low </textPath></text>

  <text class="r4"><textPath href="#c4" startOffset="0" textLength="828" lengthAdjust="spacing">sleep where the soft light falls and i will keep your place in every song i know goodbye is a heavy word </textPath></text>

  <text class="r5"><textPath href="#c5" startOffset="0" textLength="502" lengthAdjust="spacing">so carry it gently, love rest now, rest easy goodnight </textPath></text>
</svg>
